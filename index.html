    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nottura",
        "description": "Layanan independen akses Google AI Pro lewat Google Family Sharing.",
        "logo": "/logo.svg"
      }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Apa itu Google Family Sharing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fitur resmi Google yang memungkinkan satu grup keluarga berbagi langganan, termasuk Google AI Pro. Kamu bergabung ke grup lewat undangan ke akun Google pribadimu."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah anggota lain bisa lihat percakapan saya?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tidak otomatis. Gemini dan riwayat percakapan dipakai lewat akun masing-masing. Tetap jaga keamanan akunmu dan jangan bagikan password atau kode OTP ke siapa pun."
            }
          },
          {
            "@type": "Question",
            "name": "Kenapa kuota Flow dan Antigravity dibagi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Beberapa layanan punya batas penggunaan bersama dalam grup, jadi pemakaian satu anggota bisa memengaruhi kuota anggota lain. Tidak semua fitur punya kuota yang sama."
            }
          },
          {
            "@type": "Question",
            "name": "Storage 5 TB itu milik pribadi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bukan. Kapasitas 5 TB adalah fasilitas grup keluarga yang dipakai bersama, bukan 5 TB privat untuk tiap anggota."
            }
          },
          {
            "@type": "Question",
            "name": "Apa bedanya Squad, Shared, dan Private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Squad: patungan 5 orang dalam satu grup, paling hemat. Shared: kamu masuk grup bersama dengan layanan pelanggan lebih personal. Private: satu grup khusus untukmu sendiri, tidak dicampur pelanggan lain."
            }
          },
          {
            "@type": "Question",
            "name": "Kenapa Squad harus 5 orang?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paket Squad dihitung per grup (Rp150.000), jadi harus ada 5 orang yang pesan sekaligus supaya harga per orang jadi Rp30.000."
            }
          },
          {
            "@type": "Question",
            "name": "Boleh pindah grup keluarga?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Perpindahan grup mengikuti ketentuan Google, termasuk pembatasan 12 bulan. Pahami mekanisme Family Sharing sebelum transaksi."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah unlimited?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tidak. Penggunaan mengikuti batas dan kebijakan Google, dan Nottura tidak menjanjikan penggunaan tanpa batas."
            }
          },
          {
            "@type": "Question",
            "name": "Kalau ada kendala, hubungi siapa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sampaikan lewat kontak resmi Nottura, kami bantu secepatnya."
            }
          }
        ]
      }
    </script>
